name: community-waste

x-application: &application
  image: community-waste:local
  build:
    context: .
    target: runtime
  environment: &application-environment
    DATABASE_URL: ${DATABASE_URL:-postgres://community:community_local@db:5432/community_waste?sslmode=disable&connect_timeout=5}
    APP_PORT: "8080"
    SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-community}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-community_local}
      POSTGRES_DB: ${POSTGRES_DB:-community_waste}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    <<: *application
    command: ["migrate", "up"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *application
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/community-waste", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s

  test-db:
    profiles: ["test"]
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: test_local
      POSTGRES_DB: community_waste_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community_waste_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    profiles: ["test"]
    build:
      context: .
      target: development
    environment:
      TEST_DATABASE_URL: postgres://community:test_local@test-db:5432/community_waste_test?sslmode=disable&connect_timeout=5
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
